:root{--bg:#0b0b0d;--bg2:#121216;--card:#18181d;--line:#2a2a33;--red:#d4a245;--gold:#e7b84f;--cy:#38d6ec;--ink:#17120a;--txt:#f4f1ea;--mut:#9d9aa3;--ok:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6;min-height:100vh}
h1,h2,h3{font-family:Cairo,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select,textarea{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.65rem .85rem;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
label{display:flex;flex-direction:column;gap:.35rem;font-weight:700;font-size:.9rem}
label small{color:var(--mut);font-weight:400}
.sar{font-style:normal;font-size:.85em;margin-inline-start:.15em}.sar::before{content:"\e900";font-family:"saudi_riyal_bold"}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem 1.1rem;border-radius:12px;font-weight:800;transition:.2s;white-space:nowrap}
.btn.red{background:linear-gradient(135deg,#f3d27a,#c9952f);color:var(--ink)}.btn.red:hover{filter:brightness(1.15)}
.btn.gh{border:1px solid var(--line);background:var(--card)}.btn.gh:hover{border-color:var(--gold)}
.btn.sm{padding:.4rem .7rem;font-size:.85rem;border-radius:10px}
.btn.del{color:#ff6b6b}
/* الدخول */
#login{min-height:100vh;display:grid;place-items:center;padding:1rem;background:radial-gradient(50% 50% at 50% 30%,rgba(212,162,69,.22),transparent)}
.lbox{width:min(400px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:2rem;display:flex;flex-direction:column;gap:1rem;text-align:center}
.lbox img{height:46px;margin:0 auto}
.err{color:#ff6b6b;font-size:.9rem;min-height:1.2em}
.demo{background:rgba(231,184,79,.1);border:1px solid rgba(231,184,79,.35);color:#ffdc8f;border-radius:12px;padding:.6rem;font-size:.85rem}
/* الواجهة */
#app{display:none;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--bg2);border-left:1px solid var(--line);padding:1.2rem;display:flex;flex-direction:column;gap:.4rem;position:sticky;top:0;height:100vh}
aside .lg{display:flex;align-items:center;gap:.6rem;margin-bottom:1.2rem}
aside .lg img{height:26px}aside .lg b{font-family:Cairo;font-size:.95rem}
.tab{display:flex;align-items:center;gap:.6rem;padding:.75rem .9rem;border-radius:12px;font-weight:700;color:var(--mut);text-align:right;width:100%}
.tab.on,.tab:hover{background:var(--card);color:var(--txt)}
.tab.on{box-shadow:inset -3px 0 0 var(--cy)}
.tab .c{margin-inline-start:auto;background:var(--cy);color:#04161a!important;color:#fff;border-radius:99px;font-size:.72rem;padding:0 .5rem}
aside .bot{margin-top:auto;display:flex;flex-direction:column;gap:.4rem}
main{padding:1.6rem;max-width:1200px;width:100%}
.top{display:flex;align-items:center;gap:.8rem;margin-bottom:1.4rem;flex-wrap:wrap}
.top h1{font-size:1.6rem;margin-inline-end:auto}
.mode{font-size:.8rem;padding:.25rem .7rem;border-radius:99px;border:1px solid}
.mode.demo-m{color:#ffdc8f;border-color:rgba(231,184,79,.4)}
.mode.live-m{color:var(--ok);border-color:rgba(34,197,94,.4)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1.4rem}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem}
.kpi b{font-family:Cairo;font-size:1.6rem;display:block}.kpi span{color:var(--mut);font-size:.85rem}
.bar{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.bar input,.bar select{width:auto;flex:1;min-width:160px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
th,td{padding:.7rem .8rem;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-size:.82rem;font-weight:700;background:var(--bg2)}
tr:last-child td{border-bottom:0}
td img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#000}
td .nm{font-weight:700}td .sb{color:var(--mut);font-size:.8rem}
.pr b{color:var(--gold);font-family:Cairo}.pr s{color:var(--mut);font-size:.85rem;margin-inline-start:.3rem}
.pct{color:#04161a;background:var(--cy);border-radius:6px;padding:0 .35rem;font-size:.75rem;font-weight:800;margin-inline-start:.3rem}
.sw{position:relative;width:44px;height:24px;border-radius:99px;background:#3a3a44;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on:after{right:23px}
.acts{display:flex;gap:.3rem;justify-content:flex-end}
.empty{text-align:center;color:var(--mut);padding:2.5rem}
/* النافذة */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;place-items:center;padding:1rem;overflow:auto}
.ov.on{display:grid}
.mbox{width:min(820px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;margin:auto}
.mh{display:flex;justify-content:space-between;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.9rem}
.up{display:grid;grid-template-columns:200px 1fr;gap:1rem;align-items:start}
.drop{aspect-ratio:1;border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;text-align:center;color:var(--mut);cursor:pointer;overflow:hidden;position:relative;background:var(--bg)}
.drop:hover,.drop.dr{border-color:var(--gold)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.chk{flex-direction:row;align-items:center;gap:.6rem;cursor:pointer}
.prev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem;display:flex;gap:.8rem;align-items:center}
.prev b.p{color:var(--gold);font-family:Cairo;font-size:1.3rem}
.ord{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:.8rem}
.ord .h{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.5rem}
.st{font-size:.78rem;padding:.1rem .6rem;border-radius:99px;font-weight:700}
.st.new{background:rgba(56,214,236,.15);color:var(--cy)}.st.done{background:rgba(34,197,94,.15);color:var(--ok)}.st.cancel{background:#333;color:var(--mut)}
.ord ul{list-style:none;color:#d4d1d9;font-size:.92rem}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--gold);padding:.65rem 1.2rem;border-radius:12px;font-weight:700;opacity:0;transition:.3s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.blk{border:1px solid var(--line);border-radius:16px;padding:1rem;display:flex;flex-direction:column;gap:.8rem;background:rgba(255,255,255,.015)}
.blk>.hd{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}.blk>.hd h3{font-size:1.05rem;margin-inline-end:auto}
.blk .hint{color:var(--mut);font-size:.82rem}
.grp,.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem;display:flex;flex-direction:column;gap:.6rem}
.row{display:flex;gap:.5rem;align-items:center}
.opt{display:grid;grid-template-columns:52px 1fr 110px auto auto auto;gap:.5rem;align-items:center}
.oimg{width:52px;height:52px;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;cursor:pointer;overflow:hidden;background:var(--bg);font-size:1.1rem;color:var(--mut);position:relative}
.oimg img{width:100%;height:100%;object-fit:cover}
.oimg .ocnt{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.75);color:#fff;font-size:.7rem;font-weight:800;border-radius:6px;padding:0 .3rem}
.ostrip{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.4rem;padding-inline-start:60px}
.ostrip .ot{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.ostrip .ot img{width:100%;height:100%;object-fit:cover}
.ostrip .ot i{position:absolute;bottom:0;inset-inline:0;background:rgba(231,184,79,.9);color:#17120a;font-size:.6rem;font-style:normal;font-weight:800;text-align:center}
.ostrip .ot button{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:6px;background:rgba(0,0,0,.75);font-size:.65rem;color:#fff}
.ostrip .ot button.mk{left:auto;right:2px;color:#f5c443}
.ostrip .ot.add{display:grid;place-items:center;align-content:center;border:1px dashed var(--gold);color:var(--gold);font-size:1.2rem;line-height:1}.ostrip .ot.add small{font-size:.65rem}
.ostrip .ot.add.busy{opacity:.5}
.nbtn{grid-column:1/-1;justify-self:start;font-size:.8rem;font-weight:700;color:var(--mut);padding:.2rem .6rem;border-radius:99px;border:1px dashed var(--line)}
.nbtn.has{color:var(--cy);border-color:var(--cy)}
.onut{grid-column:1/-1;display:flex;flex-direction:column;gap:.45rem;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.7rem}
.oimg.busy:after{content:"…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.6)}
input[type=color]{width:42px;height:42px;padding:3px;border-radius:10px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;flex:none}
.ib:hover{border-color:#ff6b6b;color:#ff6b6b}
.chipb{padding:.35rem .75rem;border-radius:99px;border:1px dashed var(--gold);color:var(--gold);font-size:.85rem;font-weight:700}
.chipb:hover{background:rgba(231,184,79,.1)}
.mini{flex-direction:row;align-items:center;gap:.35rem;font-size:.8rem;color:var(--mut);font-weight:500;white-space:nowrap}
@media(max-width:860px){.opt{grid-template-columns:52px 1fr auto 38px;grid-template-areas:"i n n d" "i p c s";padding-bottom:.6rem;border-bottom:1px solid var(--line)}
 .opt .oimg{grid-area:i;align-self:start}.ostrip{grid-column:1/-1;padding-inline-start:0}.nbtn,.onut{grid-column:1/-1}.opt .onm{grid-area:n}.opt .op{grid-area:p}.opt .oc{grid-area:c}.opt .os{grid-area:s}.opt .od{grid-area:d}}
.gal{display:flex;flex-wrap:wrap;gap:.5rem}
.gal .gi{position:relative;width:92px;height:92px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.gal .gi img{width:100%;height:100%;object-fit:cover}
.gal .gi button{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:8px;background:rgba(0,0,0,.75);font-size:.8rem}
.gal .gi.busy{display:grid;place-items:center;color:var(--mut);background:var(--bg)}
.nr{display:grid;grid-template-columns:1fr 1fr 38px;gap:.5rem}
#pDesc{min-height:200px;line-height:1.8}
.mob{display:none}
@media(max-width:860px){
 #app{grid-template-columns:1fr}
 aside{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;padding:.4rem;z-index:40;border-left:0;border-top:1px solid var(--line);justify-content:space-around}
 aside .lg,aside .bot{display:none}
 aside{justify-content:flex-start!important;overflow-x:auto;scrollbar-width:none}
 aside .tab{flex:none;min-width:64px;position:relative}
 .tab{flex-direction:column;gap:.1rem;font-size:.72rem;padding:.45rem;text-align:center;width:auto}
 .tab.on{box-shadow:inset 0 3px 0 var(--red)}
 .tab .c{position:absolute;margin:0;transform:translate(-14px,-4px)}
 .mob{display:inline-flex}
 main{padding:1rem 1rem 6rem}
 .cards{grid-template-columns:1fr 1fr}
 .g2,.g3,.up{grid-template-columns:1fr}
 .up .drop{max-width:220px}
 table thead{display:none}
 table,tbody,tr,td{display:block;width:100%}
 tr{display:grid!important;grid-template-columns:60px 1fr auto;gap:.2rem .7rem;padding:.7rem;border-bottom:1px solid var(--line)}
 td{border:0;padding:0}
 td.ci{grid-row:span 3}
 td.hm{display:none}
 td.sk{grid-column:2/3}
 td.ac{grid-column:2/4}
}
</style>
</head>

  const m = String(e && e.message || e || "");
  for (const k in PS_ERR) { const i = m.indexOf(k); if (i >= 0) { const arg = m.slice(i + k.length).replace(/^:/, "").split("\n")[0].trim(); return PS_ERR[k].replace("{0}", arg); } }
  if (/rate limit|too many/i.test(m)) return "محاولات كثيرة، جرّب بعد شوي";
  if (/password/i.test(m) && /6/.test(m)) return "كلمة المرور لازم ٦ خانات أو أكثر";
  return m || "صار خطأ، جرّب مرة ثانية";
};

/* ---------- طبقة البيانات: Supabase أو وضع التجربة ---------- */
const PSData = (() => {
  const live = !!(PS_CONFIG.SUPABASE_URL && PS_CONFIG.SUPABASE_ANON_KEY);
  const area = /admin\.html/.test(location.pathname) ? "admin" : "store";
  let sb = null;
  const LS = "ps_store_v1";
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const phoneNorm = p => { let d = String(p || "").replace(/[^\d٠-٩]/g, "").replace(/[٠-٩]/g, c => "٠١٢٣٤٥٦٧٨٩".indexOf(c)); if (d.startsWith("00")) d = d.slice(2); if (d.startsWith("05")) d = "966" + d.slice(1); if (d.startsWith("5") && d.length === 9) d = "966" + d; return d; };
  const custEmail = p => "c" + phoneNorm(p) + "@customers.perfect-supplement.store";

  async function client() {
    if (!live) return null;
    if (sb) return sb;
    const mod = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    sb = mod.createClient(PS_CONFIG.SUPABASE_URL, PS_CONFIG.SUPABASE_ANON_KEY, { auth: { storageKey: "ps-auth-" + area, persistSession: true } });
    return sb;
  }
  const chk = r => { if (r.error) throw new Error(r.error.message); return r.data; };
  function local() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) {}
    if (!d) { d = JSON.parse(JSON.stringify(PS_SEED)); saveLocal(d); }
    d.settings = Object.assign({}, PS_SEED.settings, d.settings || {});
    for (const k of ["orders", "coupons", "customers", "reviews", "checkins"]) d[k] = d[k] || [];
    return d;
  }
  function saveLocal(d) {
    try { localStorage.setItem(LS, JSON.stringify(d)); }
    catch (e) { throw new Error("مساحة التخزين في المتصفح امتلأت (وضع التجربة)"); }
  }
  const bySort = (a, b) => (a.sort ?? 999) - (b.sort ?? 999);
  const demoCust = () => { const id = localStorage.getItem("ps_demo_cust"); return id ? local().customers.find(c => c.id === id) || null : null; };

  /* نسخة محلية من حساب الطلب (نفس منطق قاعدة البيانات) */
  function couponLocal(d, code, sub) {
    const c = d.coupons.find(x => x.code === String(code).trim().toUpperCase());
    const today = new Date().toISOString().slice(0, 10);
    if (!c || !c.active) throw new Error("coupon_invalid");
    if (c.expires_at && c.expires_at < today) throw new Error("coupon_expired");
    if (c.max_uses != null && c.max_uses !== "" && c.used >= +c.max_uses) throw new Error("coupon_used_up");
    if (sub < +c.min_total) throw new Error("coupon_min:" + c.min_total);
    return c.type === "percent" ? Math.round(sub * Math.min(+c.value, 100)) / 100 : Math.min(+c.value, sub);
  }
  function orderLocal(p) {
    const d = local(), S = d.settings, me = demoCust();
    if (!p.items || !p.items.length) throw new Error("empty_cart");
    if (!String(p.customer || "").trim()) throw new Error("name_required");
    if (p.payment === "online" && S.pay_enabled !== "true") throw new Error("online_disabled");
    let sub = 0; const items = [];
    for (const it of p.items) {
      const pr = d.products.find(x => x.id === it.id); if (!pr) throw new Error("product_missing");
      if (pr.in_stock === false) throw new Error("out_of_stock:" + pr.name);
      const G = PSU.groups(pr), lab = []; let price = +pr.price;
      G.forEach((g, gi) => { const o = g.items[(it.sel || [])[gi] || 0]; if (!o) throw new Error("option_missing:" + pr.name);
        if (o.in_stock === false) throw new Error("out_of_stock:" + pr.name + " - " + o.name);
        if (+o.price > 0) price = +o.price; lab.push(G.length > 1 || g.name !== "النكهة" ? g.name + ": " + o.name : o.name); });
      const q = Math.max(1, Math.min(99, +it.qty || 1)); sub += price * q;
      items.push({ id: pr.id, name: pr.name, flavor: lab.join(" • "), qty: q, price });
    }
    let disc = 0, pts = 0, pdisc = 0;
    if (p.coupon) { disc = couponLocal(d, p.coupon, sub); d.coupons.find(x => x.code === p.coupon.trim().toUpperCase()).used++; }
    const pv = +S.point_value || 0;
    if (me && S.points_enabled === "true" && p.use_points && pv > 0) { const c = d.customers.find(x => x.id === me.id);
      pts = Math.max(0, Math.min(c.points, Math.floor((sub - disc) / pv))); pdisc = Math.round(pts * pv * 100) / 100; c.points -= pts; }
    const dfee = +S.delivery_fee || 0, dmin = +S.free_delivery_min || 0;
    const fee = p.method === "توصيل" && dfee > 0 && !(dmin > 0 && sub >= dmin) ? dfee : 0;
    const net = Math.max(0, sub - disc - pdisc), total = net + fee;
    const earn = me && S.points_enabled === "true" ? Math.floor(net * (+S.points_per_riyal || 0)) : 0;
    const o = { id: "PS" + uid().slice(0, 7).toUpperCase(), customer: p.customer, phone: p.phone || "", method: p.method || "", notes: p.notes || "",
      items, total, status: "new", user_id: me ? me.id : null, subtotal: sub, coupon: (p.coupon || "").trim().toUpperCase(), discount: disc,
      points_used: pts, points_discount: pdisc, points_earned: earn, delivery_fee: fee, awarded: false, refunded: false, payment: p.payment === "online" ? "online" : "cod",
      paid: false, payment_id: "", created_at: new Date().toISOString() };
    d.orders.unshift(o); saveLocal(d);
    return { id: o.id, items, subtotal: sub, discount: disc, points_used: pts, points_discount: pdisc, delivery_fee: fee, total, points_earned: earn, payment: o.payment };
  }

  return {
    live, uid, phoneNorm,
    async load() {
      if (!live) { const d = local(); return { settings: d.settings, categories: d.categories.sort(bySort), products: d.products.sort(bySort) }; }
      const c = await client();
      const [s, cats, prods] = await Promise.all([
        c.from("settings").select("data").eq("id", 1).maybeSingle(),
        c.from("categories").select("*").order("sort"),
        c.from("products").select("*").order("sort")
      ]);
      if (prods.error) console.error(prods.error);
      return { settings: Object.assign({}, PS_SEED.settings, s.data?.data || {}), categories: cats.data || [], products: prods.data || [] };
    },
    /* ===== المتجر ===== */
    async checkCoupon(code, sub) {
      if (!live) { try { return { ok: true, discount: couponLocal(local(), code, sub) }; } catch (e) { return { ok: false, error: e.message }; } }
      const c = await client(); return chk(await c.rpc("check_coupon", { p_code: code, p_subtotal: sub }));
    },
    async placeOrder(p) {
      if (!live) return orderLocal(p);
      const c = await client(); return chk(await c.rpc("place_order", { p }));
    },
    async attachPayment(order, payment) {
      if (!live) { const d = local(); const o = d.orders.find(x => x.id === order); if (o) { o.payment_id = payment; saveLocal(d); } return; }
      const c = await client(); await c.rpc("attach_payment", { p_order: order, p_payment: payment });
    },
    async verifyPayment(order, payment) {
      if (!live) return { paid: false, error: "demo" };
      try {
        const r = await fetch(PS_CONFIG.SUPABASE_URL + "/functions/v1/verify-payment", { method: "POST",
          headers: { "Content-Type": "application/json", apikey: PS_CONFIG.SUPABASE_ANON_KEY, Authorization: "Bearer " + PS_CONFIG.SUPABASE_ANON_KEY },
          body: JSON.stringify({ order_id: order, payment_id: payment }) });
        if (!r.ok) return { paid: false, error: "verify_unavailable" };
        return await r.json();
      } catch (e) { return { paid: false, error: "verify_unavailable" }; }
    },
    async orderStatus(id) {
      if (!live) { const o = local().orders.find(x => x.id === id); return o ? { id: o.id, total: o.total, paid: o.paid, status: o.status, payment: o.payment } : null; }
      const c = await client(); return chk(await c.rpc("order_status", { p_order: id }));
    },
    async reviews() {
      if (!live) return local().reviews.filter(r => r.approved);
      const c = await client(); return chk(await c.from("reviews").select("id,product_id,name,rating,body,created_at").eq("approved", true).order("created_at", { ascending: false }).limit(1000));
    },
    async addReview(product, rating, body) {
      if (!live) { const d = local(), me = demoCust(); if (!me) throw new Error("login_required");
        if (!d.orders.some(o => o.user_id === me.id && o.status === "done" && o.items.some(i => i.id === product))) throw new Error("not_purchased");
        d.reviews = d.reviews.filter(r => !(r.product_id === product && r.user_id === me.id));
        d.reviews.unshift({ id: uid(), product_id: product, user_id: me.id, name: me.name, rating, body, approved: false, created_at: new Date().toISOString() }); saveLocal(d); return; }
      const c = await client(); chk(await c.rpc("add_review", { p_product: product, p_rating: rating, p_body: body }));
    },
    /* ===== حساب العميل ===== */
    async signUp(name, phone, pass) {
      if (phoneNorm(phone).length < 11) throw new Error("اكتب رقم جوال صحيح");
      if (String(pass).length < 6) throw new Error("كلمة المرور لازم ٦ خانات أو أكثر");
      if (!live) { const d = local(); if (d.customers.some(c => c.phone === phoneNorm(phone))) throw new Error("User already registered");
        const c = { id: uid(), name, phone: phoneNorm(phone), pass, points: 0 }; d.customers.push(c); saveLocal(d); localStorage.setItem("ps_demo_cust", c.id); return; }
      const c = await client();
      const r = await c.auth.signUp({ email: custEmail(phone), password: pass, options: { data: { name } } });
      if (r.error) throw new Error(r.error.message);
      if (!r.data.session) throw new Error("التسجيل يحتاج تفعيل من إعدادات المحل (إيقاف تأكيد الإيميل)");
      chk(await c.rpc("save_profile", { p_name: name, p_phone: phoneNorm(phone) }));
    },
    async signIn(phone, pass) {
      if (!live) { const c = local().customers.find(x => x.phone === phoneNorm(phone) && x.pass === pass); if (!c) throw new Error("Invalid login credentials"); localStorage.setItem("ps_demo_cust", c.id); return; }
      const c = await client();
      const r = await c.auth.signInWithPassword({ email: custEmail(phone), password: pass });
      if (r.error) throw new Error(r.error.message);
    },
    async me() {
      if (!live) { const c = demoCust(); if (!c) return null; const d = local();
        return { id: c.id, name: c.name, phone: c.phone, points: c.points, fit: c.fit || {}, orders: d.orders.filter(o => o.user_id === c.id),
          checkins: d.checkins.filter(x => x.user_id === c.id).sort((a, b) => a.created_at.localeCompare(b.created_at)) }; }
      const c = await client(); const { data } = await c.auth.getSession(); if (!data.session) return null;
      const u = data.session.user;
      let p = (await c.from("customers").select("*").eq("id", u.id).maybeSingle()).data;
      if (!p) { await c.rpc("save_profile", { p_name: u.user_metadata?.name || "", p_phone: (u.email || "").replace(/^c|@.*$/g, "") }); p = (await c.from("customers").select("*").eq("id", u.id).maybeSingle()).data; }
      const o = (await c.from("orders").select("id,items,total,status,paid,payment,created_at,points_earned,points_used").eq("user_id", u.id).order("created_at", { ascending: false }).limit(50)).data || [];
      const ck = (await c.from("checkins").select("weight,waist,note,created_at").eq("user_id", u.id).order("created_at")).data || [];
      return { id: u.id, name: p?.name || "", phone: p?.phone || "", points: p?.points || 0, fit: p?.fit || {}, orders: o, checkins: ck };
    },
    async signOut() { if (!live) { localStorage.removeItem("ps_demo_cust"); return; } const c = await client(); await c.auth.signOut(); },
    async saveFit(fit) {
      if (!live) { const d = local(), me = demoCust(); if (!me) throw new Error("login_required"); d.customers.find(x => x.id === me.id).fit = fit; saveLocal(d); return; }
      const c = await client(); chk(await c.rpc("save_fit", { p: fit }));
    },
    async addCheckin(weight, waist, note) {
      if (!live) { const d = local(), me = demoCust(); if (!me) throw new Error("login_required");
        const last = d.checkins.filter(x => x.user_id === me.id).map(x => x.created_at).sort().pop();
        if (last && Date.now() - new Date(last) < 21 * 864e5 && !localStorage.getItem("ps_demo_fast")) throw new Error("checkin_too_soon:" + new Date(new Date(last).getTime() + 21 * 864e5).toISOString().slice(0, 10));
        d.checkins.push({ id: uid(), user_id: me.id, weight, waist: waist || null, note: note || "", created_at: new Date().toISOString() }); saveLocal(d); return; }
      const c = await client(); chk(await c.rpc("add_checkin", { p_weight: weight, p_waist: waist || 0, p_note: note || "" }));
    },
    async updateName(name) { if (!live) { const d = local(), me = demoCust(); d.customers.find(x => x.id === me.id).name = name; saveLocal(d); return; }
      const c = await client(); chk(await c.rpc("save_profile", { p_name: name, p_phone: "" })); },

    /* ===== لوحة التحكم ===== */
    async login(user, pass) {
      if (!live) { if (pass === PS_CONFIG.DEMO_PASSWORD) { sessionStorage.setItem("ps_demo_auth", "1"); return true; } throw new Error("كلمة المرور غلط"); }
      const c = await client();
      let email = String(user).trim(); if (!email.includes("@")) email = email.toLowerCase() + "@perfect-supplement.store";
      const { error } = await c.auth.signInWithPassword({ email, password: pass });
      if (error) throw new Error("اسم المستخدم أو كلمة المرور غلط");
      const adm = chk(await c.rpc("is_admin"));
      if (!adm) { await c.auth.signOut(); throw new Error("هذا الحساب مو حساب المحل"); }
      return true;
    },
    async session() {
      if (!live) return sessionStorage.getItem("ps_demo_auth") === "1";
      const c = await client(); const { data } = await c.auth.getSession(); if (!data.session) return false;
      try { return !!chk(await c.rpc("is_admin")); } catch (e) { return false; }
    },
    async logout() { if (!live) { sessionStorage.removeItem("ps_demo_auth"); return; } const c = await client(); await c.auth.signOut(); },
    async uploadImage(blob) {
      if (!live) return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      const c = await client();
      const path = "p/" + uid() + ".webp";
      const { error } = await c.storage.from("products").upload(path, blob, { contentType: "image/webp", upsert: false });
      if (error) throw new Error("ما قدرت أرفع الصورة: " + error.message);
      return c.storage.from("products").getPublicUrl(path).data.publicUrl;
    },
    async save(table, row, key = "id") {
      if (key === "id" && !row.id) row.id = uid();
      if (!live) { const d = local(); const arr = d[table]; const i = arr.findIndex(x => x[key] === row[key]); if (i >= 0) arr[i] = Object.assign(arr[i], row); else arr.push(row); saveLocal(d); return row; }
      const c = await client(); chk(await c.from(table).upsert(row)); return row;
    },
    async update(table, id, patch, key = "id") {
      if (!live) { const d = local(); const r = (d[table] || []).find(x => x[key] === id); if (r) Object.assign(r, patch); saveLocal(d); return; }
      const c = await client(); chk(await c.from(table).update(patch).eq(key, id));
    },
    async remove(table, id, key = "id") {
      if (!live) { const d = local(); d[table] = d[table].filter(x => x[key] !== id); saveLocal(d); return; }
      const c = await client(); chk(await c.from(table).delete().eq(key, id));
    },
    async dump(table) {
      if (!live) { const d = local(); return table === "settings" ? [{ id: 1, data: d.settings }] : (d[table] || []); }
      const c = await client(); let all = [], f = 0;
      for (;;) { const r = chk(await c.from(table).select("*").range(f, f + 999)); all = all.concat(r); if (r.length < 1000) break; f += 1000; }
      return all;
    },
    async list(table, order = "created_at") {
      if (!live) return local()[table] || [];
      const c = await client(); return chk(await c.from(table).select("*").order(order, { ascending: false }).limit(500));
    },
    async saveSettings(s) {
      if (!live) { const d = local(); d.settings = s; saveLocal(d); return; }
      const c = await client(); chk(await c.from("settings").upsert({ id: 1, data: s }));
    },
    async orders() { return this.list("orders"); },
    async setOrderStatus(id, status) {
      if (!live) { const d = local(); const o = d.orders.find(x => x.id === id); if (!o) return; const prev = o.status; o.status = status;
        const cu = o.user_id && d.customers.find(c => c.id === o.user_id);
        if (cu) { if (status === "done" && !o.awarded && o.points_earned > 0) { cu.points += o.points_earned; o.awarded = true; }
          if (status === "cancel" && prev !== "cancel") { if (o.awarded) { cu.points = Math.max(0, cu.points - o.points_earned); o.awarded = false; }
            if (!o.refunded && o.points_used > 0) { cu.points += o.points_used; o.refunded = true; } } }
        saveLocal(d); return; }
      const c = await client(); chk(await c.from("orders").update({ status }).eq("id", id));
    },
    async setPaid(id, paid) {
      if (!live) { const d = local(); const o = d.orders.find(x => x.id === id); if (o) o.paid = paid; saveLocal(d); return; }
      const c = await client(); chk(await c.from("orders").update({ paid }).eq("id", id));
    },
    resetDemo() { localStorage.removeItem(LS); localStorage.removeItem("ps_demo_cust"); }
  };
})();

/* أدوات مشتركة */
const PSU = {
  esc: s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])),
  num: n => Number(n || 0).toLocaleString("ar-SA", { maximumFractionDigits: 2 }),
  sar: '<i class="sar" aria-label="ريال"></i>',
  off: (p) => p.old_price && p.old_price > p.price ? Math.round((1 - p.price / p.old_price) * 100) : 0,
  flavors: p => String(p.flavors || "").split(/[،,]/).map(s => s.trim()).filter(Boolean),
  groups: p => {
    if (Array.isArray(p.options) && p.options.some(g => g.items && g.items.length)) return p.options.filter(g => g.items && g.items.length);
    const f = PSU.flavors(p); return f.length ? [{ name: "النكهة", items: f.map(n => ({ name: n })) }] : [];
  },
  paras: txt => String(txt || "").split(/\n/).map(s => s.trim()).filter(Boolean).map(l => `<p>${PSU.esc(l)}</p>`).join(""),
  section: txt => {
    const lines = String(txt || "").split(/\n/).map(s => s.trim()).filter(Boolean);
    const isTable = lines.length > 1 && lines.every(l => /[:：]/.test(l));
    if (isTable) return '<table class="nt">' + lines.map(l => { const i = l.search(/[:：]/); return `<tr><th>${PSU.esc(l.slice(0, i).trim())}</th><td>${PSU.esc(l.slice(i + 1).trim())}</td></tr>`; }).join("") + "</table>";
    return lines.map(l => `<p>${PSU.esc(l)}</p>`).join("");
  },
  stars: (r, size = "") => { const f = Math.round(r * 2) / 2; let s = ""; for (let i = 1; i <= 5; i++) s += i <= Math.round(r) ? "★" : "☆"; return `<span class="stars ${size}" aria-label="${r} من 5">${s}</span>`; },
  date: d => new Date(d).toLocaleDateString("ar-SA", { day: "numeric", month: "short", year: "numeric" })
};

/* =====================================================================
   محرك البرامج: حاسبة السعرات • التوصيات • التمرين • الكارديو • الأكل
   المراجع: معادلة Mifflin-St Jeor لحساب الحرق، وتوصيات ISSN للبروتين
   (1.6–2.2 جم/كجم)، وإرشادات ACSM لعدد المجموعات والتكرارات.
   ===================================================================== */
const PSPlan = (() => {
  const r5 = n => Math.round(n / 5) * 5, r10 = n => Math.round(n / 10) * 10;

  /* ---------- الحاسبة ---------- */
  const ACT = { desk: 1.2, light: 1.375, active: 1.55, hard: 1.725 };
  const GOAL = {
    cut:      { name: "تنشيف وحرق دهون", adj: -0.20, p: 2.2, f: 0.25, icon: "🔥" },
    recomp:   { name: "شد وتحسين الشكل", adj: -0.05, p: 2.0, f: 0.27, icon: "⚖️" },
    lean:     { name: "تضخيم نظيف",      adj: 0.10,  p: 1.8, f: 0.25, icon: "💪" },
    gain:     { name: "زيادة وزن (للنحيف)", adj: 0.18, p: 1.7, f: 0.27, icon: "🍽️" }
  };
  function activity(f) { // أيام التمرين + طبيعة العمل
    const d = +f.days || 0;
    let a = d <= 1 ? 1.2 : d <= 3 ? 1.375 : d <= 5 ? 1.55 : 1.725;
    if (f.job === "active") a += 0.1; if (f.job === "hard") a += 0.175;
    return Math.min(a, 1.9);
  }
  function calc(f) {
    const w = +f.weight, h = +f.height, age = +f.age;
    const bmr = 10 * w + 6.25 * h - 5 * age + (f.sex === "f" ? -161 : 5);
    const tdee = bmr * activity(f);
    const g = GOAL[f.goal] || GOAL.recomp;
    let kcal = tdee * (1 + g.adj) + (+f.adj || 0);
    const floor = f.sex === "f" ? 1300 : 1600;              // ما ننزل تحت حد آمن
    kcal = Math.max(floor, r10(kcal));
    const protein = r5(Math.min(g.p * w, 2.4 * w));
    const fat = r5(Math.max(0.6 * w, kcal * g.f / 9));
    const carbs = r5(Math.max(50, (kcal - protein * 4 - fat * 9) / 4));
    const water = Math.round(w * 35 / 100) / 10;            // لتر
    const bmi = w / ((h / 100) ** 2);

    "أوقف التمرين فورًا واطلب المساعدة الطبية إذا حسيت بألم في الصدر، أو دوخة، أو ضيق تنفس، أو أي عرض غير طبيعي.",

    "نحفظ بياناتك عشان نجهز برنامجك ونتابع تقدمك فقط، ولا نشاركها مع أي جهة، وتقدر تطلب حذفها في أي وقت عن طريق الواتساب."
  ];

  return { GOAL, HEALTH, TERMS, VITAMINS, calc, recommend, blocked, needsDoctor, workout, cardio, meals, supSchedule, progress };
})();

/* ضغط الصورة قبل الرفع */
/* تجهيز الصورة: مربع ١٠٠٠×١٠٠٠، الصورة كاملة في النص بدون قص، والفراغ بلون خلفيتها */
function compress(file,max=1000){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{
  const S=max,c=document.createElement("canvas");c.width=c.height=S;const x=c.getContext("2d");
  const t=document.createElement("canvas"),tw=Math.max(1,Math.min(200,img.width)),th=Math.max(1,Math.round(img.height*tw/img.width));t.width=tw;t.height=th;
  const tx=t.getContext("2d");tx.drawImage(img,0,0,tw,th);const d=tx.getImageData(0,0,tw,th).data;let r=0,g=0,b=0,n=0,clear=0;
  const px=(i,j)=>{const k=(j*tw+i)*4;if(d[k+3]<200){clear++;return;}r+=d[k];g+=d[k+1];b+=d[k+2];n++;};
  for(let i=0;i<tw;i++){px(i,0);px(i,th-1);}for(let j=0;j<th;j++){px(0,j);px(tw-1,j);}
  if(n&&clear<n){x.fillStyle=`rgb(${Math.round(r/n)},${Math.round(g/n)},${Math.round(b/n)})`;x.fillRect(0,0,S,S);}
  const m=Math.abs(img.width-img.height)/Math.max(img.width,img.height)<.04?0:S*.04,sc=Math.min((S-2*m)/img.width,(S-2*m)/img.height),w=img.width*sc,h=img.height*sc;
  x.imageSmoothingQuality="high";x.drawImage(img,(S-w)/2,(S-h)/2,w,h);
  c.toBlob(bl=>bl?res(bl):rej(new Error("الصورة ما اشتغلت")),"image/webp",.85);URL.revokeObjectURL(img.src);};img.onerror=()=>rej(new Error("الملف مو صورة"));img.src=URL.createObjectURL(file);});}

function editP(p){

   <div style="display:flex;flex-wrap:wrap;gap:.5rem 1.2rem" id="pCau">${[["stim","فيه كافيين أو منبهات"],["creatine","فيه كرياتين"],["sugar","فيه سكريات أو كربوهيدرات عالية"]].map(([v,l])=>`<label class="chk"><input type="checkbox" value="${v}" style="width:auto" ${(p.cautions||[]).includes(v)?"checked":""}> ${l}</label>`).join("")}</div></div>
  <div class="g3"><label class="chk"><input type="checkbox" id="pStock" style="width:auto" ${p.in_stock!==false?"checked":""}> متوفر</label>

  <div style="display:flex;gap:.6rem;justify-content:flex-end"><button class="btn gh" data-x>إلغاء</button><button class="btn red" id="pSave">حفظ المنتج</button></div>`;
  $("#ov").classList.add("on");
  let imgVal=p.image,blob=null;
  const drop=$("#drop"),file=$("#file");
  drop.onclick=()=>{file.value="";file.click();};
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("dr");};drop.ondragleave=()=>drop.classList.remove("dr");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("dr");if(e.dataTransfer.files[0])pick(e.dataTransfer.files[0]);};

  async function pick(f){try{blob=await compress(f);const u=URL.createObjectURL(blob);drop.innerHTML=`<img src="${u}">`;updPrev();}catch(e){say(e.message);}}
  function updPrev(){const pr=+$("#pPrice").value||0,ol=+$("#pOld").value||0,o=ol>pr&&pr?Math.round((1-pr/ol)*100):0;

  ["pPrice","pOld"].forEach(i=>$("#"+i).oninput=updPrev);updPrev();

  let G=JSON.parse(JSON.stringify(groups(p))).map(g=>({name:g.name,items:g.items.map(i=>{const o=Object.assign({name:"",image:"",price:"",color:"",in_stock:true},i);o.images=(Array.isArray(i.images)&&i.images.length?i.images:[i.image]).filter(Boolean);o.nutrition=Array.isArray(i.nutrition)?i.nutrition.map(r=>[r[0],r[1]]):[];return o;})}));

    if(t.dataset.nrd){const[a,b,k]=t.dataset.nrd.split(":").map(Number);G[a].items[b].nutrition.splice(k,1);drawG();return;}

      it.nutrition=NUT.map(r=>[r[0],have.get(r[0])||r[1]||""]).concat(it.nutrition.filter(r=>r[0]&&!NUT.some(x=>x[0]===r[0])));drawG();return;}

    if(t.dataset.om){const[a,b,k]=t.dataset.om.split(":").map(Number);const im=G[a].items[b].images;im.unshift(im.splice(k,1)[0]);drawG();return;}

    else if(t.dataset.oi){const[a,b]=t.dataset.oi.split(":").map(Number);const f=document.createElement("input");f.type="file";f.accept="image/*";f.multiple=true;
      f.onchange=async()=>{const fs=[...f.files];if(!fs.length)return;const box=$("#grps").querySelectorAll(".grp")[a].querySelectorAll(".opt")[b];box.querySelectorAll("[data-oi]").forEach(x=>x.classList.add("busy"));

  $("#grps").addEventListener("change",e=>{if(e.target.matches("[data-gn]")){syncG();drawG();}});
  document.querySelectorAll("[data-ag]").forEach(b=>b.onclick=()=>{syncG();G.push({name:b.dataset.ag,items:[{name:"",image:"",images:[],price:"",color:"",in_stock:true,nutrition:[]}]});drawG();
    const gs=$("#grps").querySelectorAll(".grp");const last=gs[gs.length-1];(b.dataset.ag?last.querySelector("[data-on]"):last.querySelector("[data-gn]")).focus();});
  drawG();
  /* ---- الأقسام ---- */
  const TPL={nut:["القيم الغذائية","حجم الحصة: \nالسعرات الحرارية: \nالبروتين: \nالكربوهيدرات: \nالسكريات: \nالدهون: \nالصوديوم: "],use:["طريقة الاستخدام",""],ing:["المكونات",""]};
  function syncS(){document.querySelectorAll("#secs .sec").forEach((el,i)=>{SEC[i].title=el.querySelector("[data-st]").value.trim();SEC[i].body=el.querySelector("[data-sb]").value;});}

  $("#secs").onclick=async e=>{const t=e.target.closest("[data-ds],[data-mu]");if(!t)return;syncS();
    if(t.dataset.ds!==undefined){if(!await ask("تحذف هذا القسم؟","احذف"))return;SEC.splice(+t.dataset.ds,1);}
    else{const i=+t.dataset.mu;[SEC[i-1],SEC[i]]=[SEC[i],SEC[i-1]];}drawS();};
  document.querySelectorAll("[data-as]").forEach(b=>b.onclick=()=>{syncS();const t=TPL[b.dataset.as]||["",""];SEC.push({title:t[0],body:t[1]});drawS();

  if(!NUT&&si>=0){NUT=SEC[si].body.split("\n").filter(l=>/[:：]/.test(l)).map(l=>{const k=l.search(/[:：]/);return[l.slice(0,k).trim(),l.slice(k+1).trim()];});SEC.splice(si,1);drawS();}
  if(!NUT)NUT=NUTDEF.map(k=>[k,""]);
  function syncN(){document.querySelectorAll("#nut .nr").forEach((r,i)=>{NUT[i]=[r.querySelector("[data-nk]").value.trim(),r.querySelector("[data-nv]").value.trim()];});}
  function drawN(){$("#nut").innerHTML=NUT.map((r,i)=>`<div class="nr"><input data-nk value="${esc(r[0])}" placeholder="مثلًا: الكرياتين"><input data-nv value="${esc(r[1])}" placeholder="مثلًا: 24 جم"><button class="ib" data-nd="${i}" title="حذف">✕</button></div>`).join("");}
  $("#nut").onclick=e=>{const b=e.target.closest("[data-nd]");if(!b)return;syncN();NUT.splice(+b.dataset.nd,1);drawN();};
  $("#nAdd").onclick=()=>{syncN();NUT.push(["",""]);drawN();const k=$("#nut").querySelectorAll("[data-nk]");k[k.length-1].focus();};
  drawN();
  const ta=$("#pDesc"),grow=()=>{ta.style.height="auto";ta.style.height=Math.max(200,ta.scrollHeight+4)+"px";};ta.oninput=grow;setTimeout(grow,0);
  $("#pSave").onclick=async()=>{syncG();syncS();syncN();const b=$("#pSave");
    const name=$("#pName").value.trim(),price=parseFloat($("#pPrice").value);
    if(!name)return $("#pName").focus(),toast("اكتب اسم المنتج");
    if(!(price>=0))return $("#pPrice").focus(),toast("اكتب السعر");

    const old=parseFloat($("#pOld").value);
    if(old&&old<=price&&!await ask("السعر «قبل» أقل من أو يساوي السعر الحالي، فما راح يطلع خصم. تكمل؟","كمّل"))return;
    b.disabled=true;b.textContent="جاري الحفظ…";

      Object.assign(p,{name,brand:$("#pBrand").value.trim(),category_id:$("#pCat").value,short:$("#pShort").value.trim(),description:$("#pDesc").value.trim(),
        flavors:"",cautions:[...document.querySelectorAll("#pCau input:checked")].map(i=>i.value),goals:[...document.querySelectorAll("#pGoals input:checked")].map(i=>i.value),images:GAL,nutrition:NUT.filter(r=>r[0]&&r[1]),options:G.map(g=>({name:g.name||"خيار",items:g.items.filter(i=>i.name||i.images.length).map(i=>({name:i.name||g.name,image:i.images[0]||"",images:i.images,nutrition:i.nutrition.filter(r=>r[0]&&r[1]),price:+i.price>0?+i.price:null,color:isColor(g.name)?i.color||"":"",in_stock:i.in_stock!==false}))})).filter(g=>g.items.length),
        sections:SEC.map(x=>({title:x.title,body:x.body.split("\n").map(l=>l.trim()).filter(l=>l&&!/[:：]$/.test(l)).join("\n")})).filter(x=>x.title&&x.body),price,old_price:old>0?old:null,badge:$("#pBadge").value.trim(),image:imgVal,in_stock:$("#pStock").checked,featured:$("#pFeat").checked,sort:parseInt($("#pSort").value)||0});
      await PSData.save("products",p);await reload();closeM();vProducts();toast("انحفظ ✓");}

  const state=c=>!c.active?"موقوف":c.expires_at&&c.expires_at<today?"منتهي":c.max_uses&&c.used>=c.max_uses?"خلص":"شغّال";
  $("#view").innerHTML=`<div class="bar"><p style="color:var(--mut);flex:1">الزبون يكتب الكود في السلة، والخصم ينحسب لحاله.</p><button class="btn red" id="cpNew">＋ كود جديد</button></div>
   ${C.length?`<table><thead><tr><th>الكود</th><th>الخصم</th><th class="hm">الشروط</th><th>الاستخدام</th><th>الحالة</th><th></th></tr></thead><tbody>
   ${C.map(c=>`<tr data-c="${esc(c.code)}"><td class="ci" style="font-weight:800;direction:ltr;text-align:right">${esc(c.code)}</td><td>${c.type==="percent"?num(c.value)+"٪":num(c.value)+sar}</td>
    <td class="hm" style="color:var(--mut);font-size:.85rem">${+c.min_total?`من ${num(c.min_total)} ريال`:"بدون حد أدنى"}${c.expires_at?` • لين ${esc(c.expires_at)}`:""}</td>
    <td>${num(c.used)}${c.max_uses?` / ${num(c.max_uses)}`:""}</td><td><span class="st ${state(c)==="شغّال"?"done":"cancel"}">${state(c)}</span></td>
    <td class="ac"><div class="acts"><button class="btn gh sm" data-e>تعديل</button><button class="btn gh sm del" data-d>حذف</button></div></td></tr>`).join("")}</tbody></table>`
   :`<div class="empty">ما فيه أكواد للحين. سوِّ أول كود، مثلًا WELCOME10 خصم ١٠٪ للعملاء الجدد.</div>`}`;
  $("#cpNew").onclick=()=>editCp(null,C);
  $("#view").querySelectorAll("tr[data-c]").forEach(tr=>{const c=C.find(x=>x.code===tr.dataset.c);
    tr.querySelector("[data-e]").onclick=()=>editCp(c,C);

function editCp(c,C){const n=!c;c=c||{code:"",type:"percent",value:"",min_total:0,max_uses:"",expires_at:"",active:true,used:0};
  $("#mbox").innerHTML=`<div class="mh"><h2>${n?"كود خصم جديد":"تعديل الكود"}</h2><button class="btn gh sm" data-x>✕</button></div>
   <label>الكود <small>حروف إنجليزية وأرقام</small><input id="kCode" value="${esc(c.code)}" ${n?"":"disabled"} dir="ltr" placeholder="WELCOME10" style="text-transform:uppercase"></label>
   <div class="g2"><label>نوع الخصم<select id="kType"><option value="percent" ${c.type==="percent"?"selected":""}>نسبة ٪</option><option value="fixed" ${c.type==="fixed"?"selected":""}>مبلغ ثابت بالريال</option></select></label>
    <label>قيمة الخصم<input id="kVal" type="number" min="1" step="0.5" value="${c.value}" placeholder="10"></label></div>
   <div class="g3"><label>أقل مبلغ للطلب <small>اختياري</small><input id="kMin" type="number" min="0" value="${+c.min_total||""}" placeholder="0"></label>
    <label>عدد مرات الاستخدام <small>فاضي = بدون حد</small><input id="kMax" type="number" min="1" value="${c.max_uses??""}"></label>
    <label>ينتهي بتاريخ <small>اختياري</small><input id="kExp" type="date" value="${esc(c.expires_at||"")}"></label></div>
   <label class="chk"><input type="checkbox" id="kAct" style="width:auto" ${c.active?"checked":""}> الكود شغّال</label>
   <div style="display:flex;gap:.6rem;justify-content:flex-end"><button class="btn gh" data-x>إلغاء</button><button class="btn red" id="kSave">حفظ</button></div>`;
  $("#ov").classList.add("on");
  $("#kSave").onclick=async()=>{const code=$("#kCode").value.trim().toUpperCase().replace(/\s/g,""),val=+$("#kVal").value;
    if(!/^[A-Z0-9_-]{2,30}$/.test(code))return say("الكود لازم يكون حروف إنجليزية أو أرقام، من ٢ إلى ٣٠ خانة");
    if(!(val>0))return say("اكتب قيمة الخصم");
    if($("#kType").value==="percent"&&val>100)return say("النسبة ما تزيد عن ١٠٠٪");
    if(n&&C.some(x=>x.code===code))return say("الكود موجود من قبل");
    const row={code,type:$("#kType").value,value:val,min_total:+$("#kMin").value||0,max_uses:+$("#kMax").value||null,expires_at:$("#kExp").value||null,active:$("#kAct").checked};
    if(n)row.used=0;
    try{await PSData.save("coupons",row,"code");closeM();vCoupons();toast("انحفظ الكود ✓");}catch(e){say(e.message);}};}

  $("#view").innerHTML=`<div class="cards" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><b>${num(CU.length)}</b><span>عميل مسجّل</span></div>
   <div class="kpi"><b>${num(CU.reduce((a,c)=>a+(+c.points||0),0))}</b><span>نقاط عند العملاء</span></div><div class="kpi"><b>${num(D.orders.filter(o=>o.user_id).length)}</b><span>طلب من عملاء مسجّلين</span></div></div>
   ${CU.length?`<table><thead><tr><th>العميل</th><th>الجوال</th><th class="hm">الهدف</th><th>الطلبات</th><th>النقاط</th><th></th></tr></thead><tbody>
   ${CU.map(c=>`<tr data-id="${c.id}"><td class="ci"><b>${esc(c.name||"—")}</b></td><td dir="ltr" style="text-align:right">${esc(String(c.phone||"").replace(/^966/,"0"))}</td>
    <td class="hm" style="font-size:.85rem;color:var(--mut)">${c.fit&&c.fit.goal&&typeof PSPlan!=="undefined"&&PSPlan.GOAL[c.fit.goal]?esc(PSPlan.GOAL[c.fit.goal].name)+" • "+num(c.fit.weight)+" كجم":"—"}</td>
    <td>${num(oc(c.id).length)} • ${num(oc(c.id).reduce((a,o)=>a+(+o.total),0))}${sar}</td><td><input type="number" value="${c.points}" data-p style="max-width:110px"></td>
    <td class="ac"><div class="acts"><button class="btn gh sm" data-s>حفظ النقاط</button>${c.phone?`<a class="btn gh sm" target="_blank" href="https://wa.me/${esc(c.phone)}">واتساب</a>`:""}</div></td></tr>`).join("")}</tbody></table>`
   :`<div class="empty">ما فيه عملاء مسجّلين للحين. العملاء يسوون حساب من زر 👤 في الموقع.</div>`}`;
  $("#view").querySelectorAll("tr[data-id]").forEach(tr=>{tr.querySelector("[data-s]").onclick=async()=>{const v=Math.max(0,parseInt(tr.querySelector("[data-p]").value)||0);
    await PSData.update("customers",tr.dataset.id,{points:v});toast("انحفظت النقاط ✓");};});
}

/* ============ الأقسام ============ */
function vCats(){
  $("#view").innerHTML=`<div class="bar"><input id="cNew" placeholder="اسم قسم جديد، مثلًا: فيتامينات"><button class="btn red" id="cAdd">＋ إضافة</button></div>
  <table><thead><tr><th>القسم</th><th>عدد المنتجات</th><th>الترتيب</th><th></th></tr></thead><tbody>
  ${D.categories.map(c=>`<tr data-id="${c.id}"><td><input value="${esc(c.name)}" data-n></td><td>${num(D.products.filter(p=>p.category_id===c.id).length)}</td>
   <td><input type="number" value="${c.sort??0}" data-o style="max-width:90px"></td><td class="ac"><div class="acts"><button class="btn gh sm" data-sv>حفظ</button><button class="btn gh sm del" data-dl>حذف</button></div></td></tr>`).join("")}</tbody></table>`;
  $("#cAdd").onclick=async()=>{const n=$("#cNew").value.trim();if(!n)return;await PSData.save("categories",{name:n,sort:D.categories.length+1});await reload();vCats();toast("انضاف القسم");};
  $("#view").querySelectorAll("tr[data-id]").forEach(tr=>{const c=D.categories.find(x=>x.id===tr.dataset.id);
    tr.querySelector("[data-sv]").onclick=async()=>{c.name=tr.querySelector("[data-n]").value.trim()||c.name;c.sort=+tr.querySelector("[data-o]").value||0;await PSData.save("categories",c);await reload();vCats();toast("انحفظ ✓");};
    tr.querySelector("[data-dl]").onclick=async()=>{if(D.products.some(p=>p.category_id===c.id))return say("فيه منتجات في هذا القسم. انقلها لقسم ثاني أول.");
      if(!await ask(`تحذف قسم «${c.name}»؟`,"احذف"))return;await PSData.remove("categories",c.id);await reload();vCats();};});
}

/* ============ الإعدادات ============ */
const F=[["store_name_ar","اسم المحل بالعربي"],["announcement","الشريط الأصفر المتحرك أعلى الموقع","مثال: الكرياتين العلبتين بـ 100 ريال فقط • عينات مجانية"],["hero_title","العنوان الكبير"],["hero_sub","الجملة تحت العنوان","",1],
 ["whatsapp","رقم الواتساب للطلبات","بصيغة 9665xxxxxxxx"],["phone","رقم الاتصال"],["address","العنوان"],["hours","أوقات العمل (تطلع في قسم «زورنا» أسفل الموقع)","",1],["delivery_note","الاستلام والتوصيل"],["delivery_fee","رسوم التوصيل داخل المدينة (ريال)","10"],["free_delivery_min","التوصيل مجاني للطلبات من (ريال) — اكتب 0 لإلغائه","250"],
 ["map_url","رابط قوقل ماب"],["rating","تقييم قوقل"],["rating_count","عدد التقييمات"],["instagram","رابط انستقرام"],["snapchat","رابط سناب"],["tiktok","رابط تيك توك"]];
document.addEventListener("click",async e=>{const b=e.target.closest("#bkBtn");if(!b)return;b.disabled=true;const t=b.textContent;b.textContent="جاري التجهيز…";
  try{const out={exported_at:new Date().toISOString(),tables:{}};
    for(const k of ["settings","categories","products","orders","coupons","customers","reviews","checkins"]){try{out.tables[k]=await PSData.dump(k);}catch(er){out.tables[k]={error:String(er.message||er)};}}
    const u=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));const l=document.createElement("a");l.href=u;l.download="perfect-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("نزلت النسخة ✓");}
  catch(er){say(er.message);}b.disabled=false;b.textContent=t;});
function vSettings(){const S=D.settings;
  const ck=(k,l)=>`<label class="chk"><input type="checkbox" data-b="${k}" style="width:auto" ${S[k]==="true"?"checked":""}> ${l}</label>`;
  const ms=String(S.pay_methods||"").split(",");
  $("#view").innerHTML=`<div class="g2">${F.map(([k,l,ph,ta])=>`<label>${l}${ta?`<textarea data-k="${k}" placeholder="${ph||""}">${esc(S[k])}</textarea>`:`<input data-k="${k}" value="${esc(S[k])}" placeholder="${ph||""}" ${/whatsapp|phone|url|instagram|snapchat|tiktok/.test(k)?'dir="ltr"':""} ${/fee|_min/.test(k)?'type="number" min="0" inputmode="decimal"':""}>`}</label>`).join("")}</div>
  <div class="blk" style="margin-top:1.2rem"><div class="hd"><h3>💾 نسخة احتياطية</h3><button class="btn red" id="bkBtn" type="button">نزّل نسخة من كل البيانات</button></div><div class="hint">ينزّل ملف فيه المنتجات والأقسام والطلبات والعملاء والكوبونات والتقييمات والإعدادات. احفظه في مكان آمن، لأن فيه بيانات العملاء. يفضّل تنزّل نسخة كل أسبوع.</div></div>
  <div class="blk" style="margin-top:1.2rem"><div class="hd"><h3>💳 الدفع</h3></div>
   ${ck("cod_enabled","الدفع عند الاستلام (الطلب يروح واتساب)")}
   ${ck("pay_enabled","الدفع الإلكتروني عن طريق ميسّر")}
   <label>المفتاح العام من ميسّر <small>يبدأ بـ pk_live أو pk_test للتجربة</small><input data-k="moyasar_pk" value="${esc(S.moyasar_pk)}" dir="ltr" placeholder="pk_live_..."></label>
   <div style="display:flex;flex-wrap:wrap;gap:.5rem 1.2rem" id="pm">${[["creditcard","مدى وفيزا وماستركارد"],["applepay","أبل باي"],["stcpay","STC Pay"]].map(([v,l])=>`<label class="chk"><input type="checkbox" value="${v}" style="width:auto" ${ms.includes(v)?"checked":""}> ${l}</label>`).join("")}</div>
   <div class="hint">لا تحط هنا المفتاح السري اللي يبدأ بـ sk أبدًا. المفتاح السري يتحط في Supabase بس.</div></div>
  <div class="blk" style="margin-top:1rem"><div class="hd"><h3>🎁 نقاط العملاء</h3></div>
   ${ck("points_enabled","تشغيل النقاط للعملاء المسجّلين")}
   <div class="g2"><label>كم نقطة لكل ريال؟<input data-k="points_per_riyal" type="number" min="0" step="0.5" value="${esc(S.points_per_riyal)}"></label>
    <label>قيمة النقطة بالريال <small>مثلًا 0.02 = كل ١٠٠ نقطة بـ ٢ ريال</small><input data-k="point_value" type="number" min="0" step="0.01" value="${esc(S.point_value)}"></label></div>
   <div class="hint" id="ptsEx"></div></div>
  <div class="blk" style="margin-top:1rem"><div class="hd"><h3>🧮 حاسبة السعرات والبرنامج المجاني</h3></div>
   ${ck("plans_enabled","تشغيل الحاسبة والبرنامج المجاني (تمرين + أكل + متابعة شهرية)")}
   <label>البرنامج المجاني يتفعّل للعميل<select data-k="plans_unlock"><option value="done" ${S.plans_unlock!=="any"?"selected":""}>بعد ما يستلم أول طلب (تعلّمه «تم»)</option><option value="any" ${S.plans_unlock==="any"?"selected":""}>أول ما يطلب أي طلب</option></select></label></div>
  <div style="display:flex;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap"><button class="btn red" id="sSave">حفظ الإعدادات</button>${PSData.live?"":`<button class="btn gh" id="reset">رجّع بيانات التجربة الأصلية</button>`}</div>`;
  const ex=()=>{const pr=+$("[data-k=points_per_riyal]").value||0,pv=+$("[data-k=point_value]").value||0;$("#ptsEx").textContent=`مثال: عميل اشترى بـ ٢٠٠ ريال ياخذ ${num(200*pr)} نقطة = خصم ${num(Math.round(200*pr*pv*100)/100)} ريال على طلبه الجاي (يعني ${num(Math.round(pr*pv*1000)/10)}٪ ترجع له).`;};
  $("[data-k=points_per_riyal]").oninput=ex;$("[data-k=point_value]").oninput=ex;ex();
  $("#sSave").onclick=async()=>{const s=Object.assign({},S);$("#view").querySelectorAll("[data-k]").forEach(i=>s[i.dataset.k]=i.value.trim());
    $("#view").querySelectorAll("[data-b]").forEach(i=>s[i.dataset.b]=i.checked?"true":"false");
    s.pay_methods=[...document.querySelectorAll("#pm input:checked")].map(i=>i.value).join(",")||"creditcard";
    if(s.pay_enabled==="true"&&!/^pk_(live|test)_/.test(s.moyasar_pk))return say("عشان تشغّل الدفع الإلكتروني، حط المفتاح العام من ميسّر (يبدأ بـ pk_)");
    if(/^sk_/.test(s.moyasar_pk))return say("هذا المفتاح السري! لا تحطه هنا. حط المفتاح العام اللي يبدأ بـ pk_");
    if(s.cod_enabled!=="true"&&s.pay_enabled!=="true")return say("لازم تخلي طريقة دفع وحدة على الأقل شغالة");
    s.whatsapp=s.whatsapp.replace(/\D/g,"").replace(/^0/,"966");
    try{await PSData.saveSettings(s);D.settings=s;toast("انحفظت الإعدادات ✓");vSettings();}catch(e){say(e.message);}};
  const r=$("#reset");if(r)r.onclick=async()=>{if(await ask("ترجع كل شي لبيانات التجربة الأصلية؟","رجّع")){PSData.resetDemo();location.reload();}};
}
})();
</script>
</body>
