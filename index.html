<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ميدو ستوديو | تصميم مواقع ومتاجر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Tajawal',sans-serif;background:#0b0b0f;color:#f2f2f2;min-height:100vh;text-align:center;overflow-x:hidden}
  .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .work{padding:90px 6vw 110px;position:relative;z-index:1}
  .work h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:10px}
  .work .sub{color:#9a9aa8;margin-bottom:44px}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;text-align:right}
  .item{display:block;border:1px solid #23232c;border-radius:18px;overflow:hidden;background:#121218;transition:transform .3s,border-color .3s;text-decoration:none;color:#f2f2f2}
  .item:hover{transform:translateY(-6px);border-color:#7c5cff}
  .item .shot{aspect-ratio:16/10;background:#1a1a22;overflow:hidden}
  .item .shot{display:grid;place-items:center}
  .item .shot img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
  .item:hover .shot img{transform:scale(1.06)}
  .item .shot span{font-size:2rem;font-weight:800;color:#fff}
  .item .m{padding:16px 18px}
  .item .m b{display:block;font-size:1.1rem}
  .item .m span{color:#9a9aa8;font-size:.9rem}
  .glow{position:fixed;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#7c5cff55,transparent 70%);top:-160px;left:-160px;filter:blur(20px);animation:float 9s ease-in-out infinite}
  .glow.b{background:radial-gradient(circle,#00d4ff40,transparent 70%);top:auto;left:auto;bottom:-180px;right:-160px;animation-delay:-4s}
  @keyframes float{50%{transform:translate(40px,30px)}}
  main{position:relative;z-index:1;max-width:620px}
  h1{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:800;margin-bottom:14px}
  h1 span{background:linear-gradient(90deg,#7c5cff,#00d4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-size:1.15rem;color:#b9b9c6;line-height:1.9;margin-bottom:28px}
  a.btn{display:inline-block;background:linear-gradient(90deg,#7c5cff,#00d4ff);color:#fff;text-decoration:none;font-weight:700;padding:14px 34px;border-radius:999px;transition:transform .2s}
  a.btn:hover{transform:translateY(-3px)}
</style>
</head>
<body>
<div class="glow"></div><div class="glow b"></div>
<section class="hero"><main>
  <h1><span>ميدو ستوديو</span></h1>
  <p>نصمم مواقع ومتاجر تخلي عملاءك يثقون فيك من أول نظرة.<br>مواقع للمحلات، صفحات للمتاجر، وتصاميم تبيع.</p>
  <a class="btn" href="https://wa.me/966597774066" target="_blank" rel="noopener">تواصل معنا على الواتساب</a>
</main></section>
<section class="work" id="work">
  <h2>أعمالنا</h2>
  <p class="sub">تصاميم سويناها لمتاجر سعودية</p>
  <div class="gal" id="gal"></div>
</section>
<script>
const W=[
 {u:'fidha/',n:'متجر فضّة',d:'خواتم رجالية فضة وسبح',i:'https://cdn.salla.sa/form-builder/iE4eHiFN2qKKSMSI5DluZjbFX5u8wJZ1HJkH3zCf.jpg',bg:'#0c0d10'},
 {u:'https://vilo-sa.com/',n:'فيلو',d:'منتجات البحر والشاطئ',bg:'linear-gradient(135deg,#0e4f6e,#5fc3d8)'}
];
const g=document.getElementById('gal');
g.innerHTML=W.map(w=>`<a class="item" href="${w.u}" target="_blank" rel="noopener"><div class="shot" style="background:${w.bg}">${w.i?`<img src="${w.i}" alt="${w.n}" loading="lazy">`:`<span>${w.n}</span>`}</div><div class="m"><b>${w.n}</b><span>${w.d}</span></div></a>`).join('');
</script>
</body>
</html>
